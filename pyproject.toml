[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pnmf"
version = "0.1.0"
description = "Probabilistic Non-negative Matrix Factorization with Projected Gradients"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-2.0-only"}
authors = [
    {name = "Luis Chumpitaz Diaz", email = "luisdiaz1997@example.com"},
]
keywords = ["nmf", "non-negative matrix factorization", "probabilistic", "machine learning", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    # torch capped below 2.11 — PyPI default for 2.11 ships +cu130 wheels, which
    # require an NVIDIA driver supporting CUDA 13. Lab cluster drivers max out at
    # CUDA 12.8 (driver 570.x), and 2.10.x default is +cu128. Lift this cap once
    # the cluster driver supports CUDA 13.
    "torch>=1.9.0,<2.11",
    "numpy>=1.19.0",
    "tqdm>=4.0.0",
    "faiss-cpu>=1.7.0",
    "gpzoo @ git+https://github.com/luisdiaz1997/GPzoo.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "isort>=5.0",
]

[project.urls]
Homepage = "https://github.com/luisdiaz1997/Probabilistic-NMF"
Repository = "https://github.com/luisdiaz1997/Probabilistic-NMF"
Issues = "https://github.com/luisdiaz1997/Probabilistic-NMF/issues"

[tool.setuptools]
packages = ["PNMF"]

[tool.setuptools.package-data]
PNMF = ["*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
